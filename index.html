<div class="form-group">
                    <label for="country">Country / Territory</label>
                    <select id="country" name="country" autocomplete="country-name" required>
                        <option value="">Select your country or territory...</option>
                        <option value="United States">United States</option>
                        <option value="U.S. Virgin Islands">U.S. Virgin Islands</option>
                        <option value="Puerto Rico">Puerto Rico</option>
                        <option value="Canada">Canada</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Caribbean (Other)">Caribbean (Other)</option>
                        <option value="Europe">Europe</option>
                        <option value="Other International">Other International</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="region">City &amp; State / Province</label>
                        <input
                            type="text"
                            id="region"
                            name="region"
                            placeholder="e.g., Atlanta, GA or St. Thomas, VI"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="postal-code">Postal / ZIP Code</label>
                        <input
                            type="text"
                            id="postal-code"
                            name="postalCode"
                            autocomplete="postal-code"
                            placeholder="e.g., 30301 or 00802"
                            required>
                    </div>
                </div>
